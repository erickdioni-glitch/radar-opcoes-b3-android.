plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.radaropcoes.b3'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.radaropcoes.b3pro32'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '3.2.1-pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
