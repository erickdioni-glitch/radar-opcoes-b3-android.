name: Gerar APK Android

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK instalável
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar arquivos do aplicativo
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/br/com/radaropcoes/b3/MainActivity.java

      - name: Construir APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publicar APK em link direto no GitHub
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.2.0 app/build/outputs/apk/debug/app-debug.apk --title "Radar B3 PRO v3.2 — Antibloqueio e cache" --notes "Backoff e cache local identificados para HTTP 429. Sem inventar cotações. Modo histórico opt-in e aviso de dados defasados; não gera ordens." --latest

      - name: Publicar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: Radar-Opcoes-B3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
