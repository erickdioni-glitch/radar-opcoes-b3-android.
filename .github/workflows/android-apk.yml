name: Gerar APK Android

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK instalável
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar arquivos do aplicativo
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/br/com/radaropcoes/b3/MainActivity.java

      - name: Construir APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publicar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: Radar-Opcoes-B3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
