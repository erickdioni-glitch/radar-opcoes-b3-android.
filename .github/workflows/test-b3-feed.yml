name: Testar fontes públicas B3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-b3-feed.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verificar endpoints externos sem chaves
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, time
          ua = {'User-Agent':'Mozilla/5.0 (Linux; Android 15; Mobile) AppleWebKit/537.36 Chrome/130 Safari/537.36', 'Accept': 'application/json, text/plain, */*'}
          urls=[
            ('Vencimentos PETR4', 'https://opcoes.net.br/listaopcoes/completa?idAcao=PETR4&listarVencimentos=true&cotacoes=false'),
            ('Preço PETR4', 'https://query1.finance.yahoo.com/v8/finance/chart/PETR4.SA?range=1mo&interval=1d'),
          ]
          for label,url in urls:
            print('\nTESTE:',label,flush=True)
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=ua),timeout=12) as res:
                body=res.read(5000000)
                print('HTTP',res.status,'bytes',len(body),flush=True)
              obj=json.loads(body)
              if 'Vencimentos' in label:
                print('success',obj.get('success'),'data.keys',list(obj.get('data',{}).keys()))
                print('vencimentos',str(obj.get('data',{}).get('vencimentos',[])[:2])[:1200])
                print('acoes',str(obj.get('data',{}).get('acoes',[]))[:1800])
                vcto=obj.get('data',{}).get('vencimentos',[{}])[0].get('value','')
                if vcto:
                  chainurl='https://opcoes.net.br/listaopcoes/completa?idAcao=PETR4&listarVencimentos=true&cotacoes=true&vencimentos='+vcto
                  with urllib.request.urlopen(urllib.request.Request(chainurl,headers=ua),timeout=12) as chres:
                    chain=json.loads(chres.read(5_000_000))
                  obj2=chain.get('data',{})
                  print('CHAIN keys', list(obj2.keys()), 'acoes',str(obj2.get('acoes',[]))[:1200])
                  print('CHAIN len',len(obj2.get('cotacoesOpcoes') or []))
                  print('CHAIN row0',str((obj2.get('cotacoesOpcoes') or [])[0:2])[:2800])
                  print('CHAIN columns',str(obj2.get('columns',[]))[:1500])
                  cols={c['name']:c['index'] for c in obj2.get('columns',[])}
                  sample=[q for q in (obj2.get('cotacoesOpcoes') or []) if len(q)>7 and float(q[cols.get('ultimo',5)] or 0)>0]
                  print('NONZERO last',len(sample),'sample',str(sample[:1])[:600])
                  selected=[a['value'] for a in obj['data']['vencimentos'] if a['dataAttributes'].get('m')=='1' and 2<=int(a['dataAttributes'].get('du','0'))<=130][:3]
                  print('SELECTED monthly',selected)
                  print('CODES by month', {month:sum(1 for q in sample if q[0].split('_')[0][4:5]==month) for month in ('J','K','L')})
                  print('DATE examples',str(sorted({str(q[cols['data/hora']])[:10] for q in sample})[-5:]))
                  strikes=[]
                  for q in sample:
                    strike,dist=float(q[cols['strike']]),float(q[cols['distancia%dostrike']])
                    if dist > -0.98: strikes.append(strike/(1+dist))
                  print('IMPLIED SPOT range', (min(strikes),max(strikes)) if strikes else 'none')
              else:
                result=(obj.get('chart',{}).get('result') or [{}])[0]
                print('meta',str(result.get('meta',{}))[:500])
            except Exception as e:
              print('ERRO',type(e).__name__,str(e),flush=True)
          PY
